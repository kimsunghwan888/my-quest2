<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>짤생성기 | 밈메이커</title>
  <style>
    :root {
      --sky-50: #f5fbff;
      --sky-100: #e6f6ff;
      --sky-200: #c7eaff;
      --sky-300: #9fd6f0;
      --sky-500: #5ca9d0;
      --sky-700: #235b79;
      --ink: #21404f;
      --muted: #6f8996;
      --line: #d4eaf4;
      --coral: #f29a87;
      --white: #fff;
      --shadow: 0 22px 55px rgba(64, 135, 165, .16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
      background:
        radial-gradient(circle at 7% 8%, rgba(255,255,255,.92) 0 8%, transparent 23%),
        radial-gradient(circle at 96% 88%, rgba(186,227,249,.75) 0 9%, transparent 26%),
        linear-gradient(145deg, #f8fdff 0%, #e8f7ff 52%, #dff2fb 100%);
    }

    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    .shell { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 34px 0 48px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 25px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; color: var(--sky-700); background: var(--white); border: 1px solid var(--line); box-shadow: 0 8px 20px rgba(69,139,171,.1); font-size: 22px; font-weight: 900; }
    .brand-name { font-weight: 900; letter-spacing: -.5px; }
    .brand-sub { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .badge { padding: 8px 12px; color: var(--sky-700); background: rgba(255,255,255,.7); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; font-weight: 800; }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 52px); line-height: 1.12; letter-spacing: -2px; }
    .intro { margin: 10px 0 26px; color: var(--muted); font-size: 16px; }
    .workspace { display: grid; grid-template-columns: minmax(280px, .87fr) minmax(420px, 1.13fr); gap: 20px; align-items: start; }
    .panel { background: rgba(255,255,255,.87); border: 1px solid rgba(255,255,255,.98); border-radius: 22px; box-shadow: var(--shadow); backdrop-filter: blur(10px); }
    .controls { padding: 24px; }
    .preview-panel { padding: 22px; background: linear-gradient(160deg, #d6f0fc, #f0faff 78%); border-color: rgba(159,214,240,.72); }
    .section-heading { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    h2 { margin: 0; font-size: 19px; letter-spacing: -.5px; }
    .caption { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
    .field { margin-bottom: 18px; }
    label { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 13px; font-weight: 900; }
    .hint { color: var(--muted); font-size: 11px; font-weight: 500; }
    input[type="text"], input[type="search"], select { width: 100%; padding: 12px 13px; color: var(--ink); background: var(--sky-50); border: 1px solid var(--line); border-radius: 12px; outline: none; }
    input:focus, select:focus { border-color: var(--sky-500); background: var(--white); box-shadow: 0 0 0 4px rgba(92,169,208,.14); }
    .search-row { display: flex; gap: 8px; }
    .search-row input { min-width: 0; }
    .search-button, .upload-button, .secondary { padding: 11px 14px; color: var(--sky-700); background: var(--sky-100); border: 1px solid var(--sky-200); border-radius: 11px; font-weight: 900; white-space: nowrap; }
    .search-button:hover, .upload-button:hover, .secondary:hover { background: var(--sky-200); }
    .search-results { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 10px; }
    .search-results button { aspect-ratio: 1; padding: 0; overflow: hidden; background: var(--sky-100); border: 2px solid transparent; border-radius: 9px; }
    .search-results button:hover { border-color: var(--coral); }
    .search-results img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .upload-button { display: block; width: 100%; text-align: center; }
    input[type="file"] { display: none; }
    .color-row { display: flex; gap: 8px; align-items: center; }
    input[type="color"] { width: 44px; height: 39px; padding: 3px; background: var(--sky-50); border: 1px solid var(--line); border-radius: 10px; }
    .color-row select { flex: 1; }
    .range-row { display: grid; grid-template-columns: 1fr 56px; gap: 10px; align-items: center; }
    input[type="range"] { width: 100%; accent-color: var(--sky-500); }
    output { color: var(--sky-700); font-size: 12px; font-weight: 900; text-align: right; }
    .actions { display: flex; gap: 9px; margin-top: 24px; }
    .primary { flex: 1; padding: 13px 16px; color: var(--white); background: var(--sky-700); border-radius: 12px; font-weight: 900; box-shadow: 0 10px 18px rgba(35,91,121,.18); }
    .pdf-button { padding: 13px 14px; color: var(--sky-700); background: #fff0ed; border: 1px solid #f6c7bc; border-radius: 12px; font-weight: 900; }
    .pdf-button:hover { background: #ffe2dc; }
    .primary:hover { background: #194a63; }
    .canvas-wrap { display: grid; place-items: center; min-height: 455px; padding: 18px; background: rgba(255,255,255,.52); border: 1px solid rgba(159,214,240,.6); border-radius: 16px; }
    canvas { display: block; width: min(100%, 600px); height: auto; background: #c7eaff; box-shadow: 0 12px 28px rgba(45,110,140,.16); }
    .preview-caption { margin: 12px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    .empty { grid-column: 1 / -1; padding: 10px; color: var(--muted); font-size: 12px; text-align: center; }
    @media (max-width: 820px) {
      .shell { width: min(100% - 24px, 620px); padding-top: 22px; }
      .badge { display: none; }
      .workspace { grid-template-columns: 1fr; }
      .preview-panel { order: -1; }
      .controls, .preview-panel { padding: 18px; border-radius: 18px; }
      .canvas-wrap { min-height: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark" aria-hidden="true">✦</div><div><div class="brand-name">짤생성기</div><div class="brand-sub">사진 한 장, 문구 한 줄</div></div></div>
      <div class="badge">Quest 5 · 밈메이커</div>
    </header>

    <h1>오늘의 기분을<br>짤로 남겨요.</h1>
    <p class="intro">사진을 올리거나 검색하고, 위아래 문구를 넣어 나만의 밈을 만들어 보세요.</p>

    <section class="workspace" aria-label="짤생성기">
      <form class="panel controls" id="makerForm">
        <div class="section-heading"><div><h2>짤 만들기</h2><p class="caption">사진과 문구를 정하면 바로 미리 볼 수 있어요.</p></div></div>
        <div class="field">
          <label for="imageSearch">사진 검색 <span class="hint">Wikimedia Commons</span></label>
          <div class="search-row"><input id="imageSearch" type="search" placeholder="예: 고양이, 바다, 웃음"><button class="search-button" type="button" id="searchButton">검색</button></div>
          <div class="search-results" id="searchResults" aria-live="polite"></div>
        </div>
        <div class="field"><label for="imageUpload">내 사진</label><label class="upload-button" for="imageUpload">사진 파일 선택</label><input id="imageUpload" type="file" accept="image/*"></div>
        <div class="field"><label for="topText">위쪽 문구</label><input id="topText" type="text" maxlength="34" value="오늘도 잘 될 거야"></div>
        <div class="field"><label for="bottomText">아래쪽 문구</label><input id="bottomText" type="text" maxlength="34" value="아마도..."></div>
        <div class="field"><label for="textStyle">문구 스타일</label><div class="color-row"><input id="textColor" type="color" value="#ffffff" aria-label="문구 색상"><select id="textStyle"><option value="stroke">흰색 + 진한 테두리</option><option value="plain">색상만</option><option value="shadow">흰색 + 그림자</option></select></div></div>
        <div class="field"><label for="fontSize">글자 크기 <output id="fontSizeValue">42px</output></label><div class="range-row"><input id="fontSize" type="range" min="24" max="76" value="42"><output id="fontSizeOutput">42px</output></div></div>
        <div class="actions"><button class="primary" type="button" id="downloadButton">PNG로 저장</button><button class="pdf-button" type="button" id="pdfButton">PDF로 저장</button><button class="secondary" type="reset">초기화</button></div>
      </form>

      <aside class="panel preview-panel"><div class="section-heading"><div><h2>미리보기</h2><p class="caption">완성된 짤을 확인하세요.</p></div></div><div class="canvas-wrap"><canvas id="memeCanvas" width="800" height="800"></canvas></div><p class="preview-caption" id="imageStatus">기본 하늘색 배경</p></aside>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('memeCanvas');
    const context = canvas.getContext('2d');
    const topText = document.getElementById('topText');
    const bottomText = document.getElementById('bottomText');
    const fontSize = document.getElementById('fontSize');
    const textColor = document.getElementById('textColor');
    const textStyle = document.getElementById('textStyle');
    const imageStatus = document.getElementById('imageStatus');
    let selectedImage = null;

    function drawText(text, y) {
      if (!text) return;
      const size = Number(fontSize.value);
      context.font = `900 ${size}px "Malgun Gothic", sans-serif`;
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillStyle = textColor.value;
      if (textStyle.value === 'stroke') { context.lineWidth = Math.max(6, size / 8); context.strokeStyle = 'rgba(20, 49, 62, .9)'; context.strokeText(text, 400, y); }
      if (textStyle.value === 'shadow') { context.shadowColor = 'rgba(20, 49, 62, .75)'; context.shadowBlur = 8; context.shadowOffsetY = 4; }
      context.fillText(text, 400, y);
      context.shadowColor = 'transparent'; context.shadowBlur = 0; context.shadowOffsetY = 0;
    }

    function drawMeme() {
      context.clearRect(0, 0, 800, 800);
      if (selectedImage) {
        const scale = Math.max(800 / selectedImage.width, 800 / selectedImage.height);
        const width = selectedImage.width * scale; const height = selectedImage.height * scale;
        context.drawImage(selectedImage, (800 - width) / 2, (800 - height) / 2, width, height);
      } else {
        const background = context.createLinearGradient(0, 0, 800, 800);
        background.addColorStop(0, '#eaf8ff'); background.addColorStop(1, '#a9dcf5');
        context.fillStyle = background; context.fillRect(0, 0, 800, 800);
        context.fillStyle = 'rgba(255,255,255,.65)'; context.beginPath(); context.arc(125, 140, 74, 0, Math.PI * 2); context.fill(); context.beginPath(); context.arc(690, 650, 116, 0, Math.PI * 2); context.fill();
        context.fillStyle = '#5ca9d0'; context.font = '900 112px sans-serif'; context.textAlign = 'center'; context.textBaseline = 'middle'; context.fillText('✦', 400, 395);
      }
      drawText(topText.value, 74); drawText(bottomText.value, 726);
    }

    function useImage(source, label) { const image = new Image(); image.onload = () => { selectedImage = image; imageStatus.textContent = label; drawMeme(); }; image.src = source; }
    document.getElementById('imageUpload').addEventListener('change', (event) => { const file = event.target.files[0]; if (file) useImage(URL.createObjectURL(file), file.name); });
    [topText, bottomText, fontSize, textColor, textStyle].forEach((element) => element.addEventListener('input', () => { document.getElementById('fontSizeValue').textContent = `${fontSize.value}px`; document.getElementById('fontSizeOutput').textContent = `${fontSize.value}px`; drawMeme(); }));
    document.getElementById('makerForm').addEventListener('reset', () => { setTimeout(() => { selectedImage = null; imageStatus.textContent = '기본 하늘색 배경'; fontSize.value = 42; document.getElementById('fontSizeValue').textContent = '42px'; document.getElementById('fontSizeOutput').textContent = '42px'; drawMeme(); }, 0); });
    document.getElementById('downloadButton').addEventListener('click', () => { const link = document.createElement('a'); link.download = 'my-meme.png'; link.href = canvas.toDataURL('image/png'); link.click(); });
    document.getElementById('pdfButton').addEventListener('click', () => {
      const printWindow = window.open('', '_blank');
      if (!printWindow) return;
      printWindow.document.write(`<title>my-meme.pdf</title><style>@page{size:A4;margin:0}body{margin:0;display:grid;place-items:center;min-height:100vh;background:#fff}img{width:min(92vw,180mm);height:auto}</style><img src="${canvas.toDataURL('image/png')}" alt="완성된 밈">`);
      printWindow.document.close(); printWindow.focus(); printWindow.onload = () => { printWindow.print(); };
    });
    document.getElementById('searchButton').addEventListener('click', async () => {
      const query = document.getElementById('imageSearch').value.trim() || 'cute';
      const results = document.getElementById('searchResults'); results.innerHTML = '<div class="empty">사진을 찾는 중...</div>';
      try {
        const response = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(query)}&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url&iiurlwidth=180&format=json&origin=*`);
        const data = await response.json(); results.innerHTML = '';
        const pages = Object.values(data.query?.pages || {});
        pages.forEach((page) => { const image = page.imageinfo?.[0]; if (!image?.thumburl) return; const button = document.createElement('button'); button.type = 'button'; button.title = page.title; button.innerHTML = `<img src="${image.thumburl}" alt="${page.title}">`; button.addEventListener('click', () => useImage(image.url, page.title.replace('File:', ''))); results.appendChild(button); });
        if (!results.children.length) results.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
      } catch (error) { results.innerHTML = '<div class="empty">검색에 실패했습니다. 사진 파일을 직접 선택해 주세요.</div>'; }
    });
    drawMeme();
  </script>
</body>
</html>
