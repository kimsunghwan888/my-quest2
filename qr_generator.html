<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR코드 생성기 | 간편 QR 만들기</title>
  <style>
    :root { --sky-50:#f5fbff; --sky-100:#e5f6ff; --sky-200:#c9eafa; --sky-500:#57a9ce; --sky-700:#245f7b; --ink:#23434f; --muted:#708a95; --line:#d5ebf3; --coral:#ed987f; --white:#fff; --shadow:0 22px 52px rgba(64,135,165,.15); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--ink); font-family:"Malgun Gothic","맑은 고딕",sans-serif; background:radial-gradient(circle at 8% 9%,rgba(255,255,255,.94) 0 8%,transparent 23%),radial-gradient(circle at 94% 88%,rgba(192,229,247,.8) 0 10%,transparent 28%),linear-gradient(145deg,#fbfeff 0%,#eaf8ff 53%,#def2fb 100%); }
    *:focus-visible { outline:3px solid rgba(237,152,127,.55); outline-offset:2px; }
    button,textarea,input,select { font:inherit; } button { border:0; cursor:pointer; }
    .shell { width:min(1060px,calc(100% - 36px)); margin:0 auto; padding:35px 0 52px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:26px; } .brand { display:flex; align-items:center; gap:12px; } .mark { display:grid; place-items:center; width:44px; height:44px; color:var(--sky-700); background:var(--white); border:1px solid var(--line); border-radius:14px; box-shadow:0 8px 20px rgba(69,139,171,.1); font-size:22px; font-weight:900; } .brand-name { font-weight:900; letter-spacing:-.5px; } .brand-sub { margin-top:2px; color:var(--muted); font-size:12px; } .badge { padding:8px 12px; color:var(--sky-700); background:rgba(255,255,255,.72); border:1px solid var(--line); border-radius:999px; font-size:12px; font-weight:800; }
    h1 { margin:0; font-size:clamp(30px,5vw,52px); line-height:1.12; letter-spacing:-2px; } .intro { margin:11px 0 27px; color:var(--muted); font-size:16px; }
    .layout { display:grid; grid-template-columns:minmax(300px,.9fr) minmax(360px,1.1fr); gap:20px; align-items:stretch; } .panel { background:rgba(255,255,255,.88); border:1px solid rgba(255,255,255,.98); border-radius:22px; box-shadow:var(--shadow); backdrop-filter:blur(10px); } .form-panel { padding:26px; } .preview-panel { padding:25px; background:linear-gradient(160deg,#d6effb,#f0faff 78%); border-color:rgba(159,214,240,.72); }
    .heading { margin-bottom:20px; } h2 { margin:0; font-size:19px; letter-spacing:-.5px; } .caption { margin:6px 0 0; color:var(--muted); font-size:13px; }
    .field { margin-bottom:19px; } label { display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; font-size:14px; font-weight:900; } .hint { color:var(--muted); font-size:11px; font-weight:500; }
    textarea,input,select { width:100%; color:var(--ink); background:var(--sky-50); border:1px solid var(--line); border-radius:12px; outline:none; } textarea { min-height:130px; padding:14px; resize:vertical; line-height:1.6; } input,select { padding:13px 14px; } input:focus,textarea:focus,select:focus { border-color:var(--sky-500); background:var(--white); box-shadow:0 0 0 4px rgba(87,169,206,.14); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .color-wrap { display:flex; align-items:center; gap:9px; } input[type=color] { width:48px; height:42px; padding:3px; } .range-row { display:grid; grid-template-columns:1fr 56px; gap:10px; align-items:center; } input[type=range] { padding:0; accent-color:var(--sky-500); } output { color:var(--sky-700); font-size:12px; font-weight:900; text-align:right; }
    .examples { display:flex; flex-wrap:wrap; gap:7px; } .example { padding:8px 10px; color:var(--sky-700); background:var(--sky-100); border:1px solid var(--sky-200); border-radius:10px; font-size:12px; font-weight:800; } .example:hover { background:var(--sky-200); }
    .actions { display:flex; gap:9px; margin-top:25px; } .primary,.secondary { padding:13px 16px; border-radius:12px; font-weight:900; } .primary { flex:1; color:white; background:var(--sky-700); box-shadow:0 10px 18px rgba(36,95,123,.18); } .primary:hover { background:#1a4e67; } .secondary { color:var(--sky-700); background:var(--sky-100); } .secondary:hover { background:var(--sky-200); }
    .qr-stage { display:grid; place-items:center; min-height:415px; padding:20px; background:rgba(255,255,255,.62); border:1px solid rgba(159,214,240,.6); border-radius:16px; } #qrCanvas { display:block; width:min(100%,340px); height:auto; padding:10px; background:white; box-shadow:0 12px 28px rgba(45,110,140,.16); image-rendering:pixelated; } .status { margin:12px 0 0; color:var(--muted); font-size:12px; text-align:center; }
    .foot { margin-top:17px; color:var(--muted); font-size:12px; text-align:center; }
    @media (max-width:760px) { .shell { width:min(100% - 24px,600px); padding-top:23px; } .badge { display:none; } .layout { grid-template-columns:1fr; } .preview-panel { order:-1; } .form-panel,.preview-panel { padding:21px; border-radius:18px; } .qr-stage { min-height:0; } }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar"><div class="brand"><div class="mark" aria-hidden="true">▦</div><div><div class="brand-name">QR코드 생성기</div><div class="brand-sub">정보를 한 장의 코드로</div></div></div><div class="badge">Quest 6 · QR 만들기</div></header>
    <h1>스캔 한 번으로<br>정보를 전해요.</h1>
    <p class="intro">웹주소, 연락처, 메모를 입력하면 바로 QR코드로 만들어 드려요.</p>
    <section class="layout" aria-label="QR코드 생성기">
      <form class="panel form-panel" id="qrForm">
        <div class="heading"><h2>QR코드 내용</h2><p class="caption">스마트폰 카메라로 읽을 내용을 입력하세요.</p></div>
        <div class="field"><label for="qrText">내용 <span class="hint">웹주소 또는 글자</span></label><textarea id="qrText" maxlength="1000" placeholder="예: https://example.com">https://www.naver.com</textarea></div>
        <div class="field"><label>빠른 입력</label><div class="examples"><button class="example" type="button" data-example="https://www.naver.com">네이버</button><button class="example" type="button" data-example="tel:010-1234-5678">전화번호</button><button class="example" type="button" data-example="오늘도 좋은 하루 보내세요.">짧은 메모</button></div></div>
        <div class="grid"><div class="field"><label for="size">크기 <output id="sizeOutput">320px</output></label><div class="range-row"><input id="size" type="range" min="180" max="600" value="320"><output id="sizeOutputSide">320px</output></div></div><div class="field"><label for="errorLevel">복원 수준</label><select id="errorLevel"><option value="L">낮음</option><option value="M" selected>보통</option><option value="Q">높음</option><option value="H">매우 높음</option></select></div></div>
        <div class="grid"><div class="field"><label for="darkColor">코드 색상</label><div class="color-wrap"><input id="darkColor" type="color" value="#1976d2"><span class="hint">파란색</span></div></div><div class="field"><label for="lightColor">배경 색상</label><div class="color-wrap"><input id="lightColor" type="color" value="#ffffff"><span class="hint">밝은 색 권장</span></div></div></div>
        <div class="actions"><button class="primary" type="button" id="downloadButton">PNG로 저장</button><button class="secondary" type="reset">초기화</button></div>
      </form>
      <aside class="panel preview-panel"><div class="heading"><h2>QR코드 미리보기</h2><p class="caption">입력과 동시에 바뀝니다.</p></div><div class="qr-stage"><canvas id="qrCanvas" width="320" height="320"></canvas></div><p class="status" id="status">스마트폰으로 스캔해 보세요.</p></aside>
    </section>
    <p class="foot">QR코드가 흐릿하지 않도록 저장한 PNG를 원본 크기로 사용하세요.</p>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <script>
    const form=document.getElementById('qrForm'); const text=document.getElementById('qrText'); const canvas=document.getElementById('qrCanvas'); const size=document.getElementById('size'); const dark=document.getElementById('darkColor'); const light=document.getElementById('lightColor'); const errorLevel=document.getElementById('errorLevel');
    function render() { const value=text.value.trim() || '내용을 입력해 주세요.'; const pixelSize=Number(size.value); document.getElementById('sizeOutput').textContent=`${pixelSize}px`; document.getElementById('sizeOutputSide').textContent=`${pixelSize}px`; try { const qr=qrcode(0,errorLevel.value); qr.addData(value); qr.make(); const image=new Image(); image.onload=()=>{canvas.width=pixelSize; canvas.height=pixelSize; const context=canvas.getContext('2d'); context.fillStyle=light.value; context.fillRect(0,0,pixelSize,pixelSize); context.drawImage(image,0,0,pixelSize,pixelSize); document.getElementById('status').textContent=text.value.trim() ? '스마트폰으로 스캔해 보세요.' : '내용을 입력하면 QR코드가 만들어집니다.';}; image.src=qr.createDataURL(8,2,dark.value,light.value); } catch(error) { document.getElementById('status').textContent='QR코드를 만들 수 없습니다.'; } }
    [text,size,dark,light,errorLevel].forEach((element)=>element.addEventListener('input',render));
    document.querySelectorAll('.example').forEach((button)=>button.addEventListener('click',()=>{text.value=button.dataset.example;render();}));
    document.getElementById('downloadButton').addEventListener('click',()=>{const link=document.createElement('a');link.download='my-qr-code.png';link.href=canvas.toDataURL('image/png');link.click();});
    form.addEventListener('reset',()=>setTimeout(()=>{size.value=320;dark.value='#1976d2';light.value='#ffffff';errorLevel.value='M';render();},0)); render();
  </script>
</body>
</html>
